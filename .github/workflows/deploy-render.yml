name: Deploy Void Arena ATV no Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Diagnosticar fonte Base64
        run: |
          cat activity-src.b64.part* | tr -d '\n\r' | base64 -d > /tmp/activity-base64.tar.gz
          echo "BASE64_ARCHIVE_BYTES=$(wc -c < /tmp/activity-base64.tar.gz)"
          tar -tzf /tmp/activity-base64.tar.gz | sed -n '1,120p'
          rm -rf /tmp/activity-base64-src
          mkdir -p /tmp/activity-base64-src
          tar -xzf /tmp/activity-base64.tar.gz -C /tmp/activity-base64-src
          echo "--- PACKAGE ---"
          cat /tmp/activity-base64-src/package.json || true
          echo "--- FILES ---"
          find /tmp/activity-base64-src -maxdepth 3 -type f | sort
          echo "--- MATCHES ---"
          grep -RniE "discordsays|broadcast|participant|participants|onrender|websocket|room|activity" /tmp/activity-base64-src --exclude-dir=node_modules | head -200 || true

      - name: Validar build
        run: |
          npm ci
          npm run build

      - name: Disparar deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_URL não configurado no repositório."
            exit 1
          fi
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy solicitado ao Render com sucesso."
