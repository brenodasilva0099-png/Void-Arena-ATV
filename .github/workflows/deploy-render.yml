name: Deploy Void Arena ATV no Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validar build
        run: |
          npm ci
          npm run build

      - name: Inspecionar fluxo de transmissão
        run: |
          echo '=== ACTIVITY WS/LAUNCH ==='
          nl -ba .activity-live/src/activity.js | sed -n '340,640p'
          echo '=== BROADCASTER ==='
          nl -ba .activity-live/src/broadcaster.js | sed -n '1,760p'
          echo '=== SERVER WS ==='
          nl -ba .activity-live/server.mjs | sed -n '320,720p'

      - name: Disparar deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_URL não configurado no repositório."
            exit 1
          fi
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy solicitado ao Render com sucesso."
